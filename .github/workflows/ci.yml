name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Next 16 generates route/layout types (LayoutProps, PageProps, …) into
      # .next/types, and next-env.d.ts is gitignored. Without this step the
      # typecheck below cannot resolve them and fails on a clean checkout even
      # though the code is correct.
      - name: Generate Next.js types
        run: pnpm exec next typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: PostgreSQL integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Validate migrations
        run: pnpm exec drizzle-kit check --config=drizzle.config.ts

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
